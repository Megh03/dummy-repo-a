steps:
  - label: ":lock: secret test"
    command: |
      echo "BUILDKITE_BRANCH=$BUILDKITE_BRANCH"
      echo "BUILDKITE_TAG=$BUILDKITE_TAG"
      if [ -n "${DEMO_SECRET:-}" ]; then
        echo "Secret is present (len=${#DEMO_SECRET})"
      else
        echo "Secret is NOT present"
        exit 1
      fi
    secrets:
      - DEMO_SECRET
